<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>56-Day Retail Analytics Kanban</title>
<style>
:root{--bg:#f6f6f3;--panel:#ecebe6;--card:#fff;--text:#1d1d1b;--mute:#6b6a64;--line:#d9d8d1;--acc:#2f6fed;--C:#c2362b;--H:#c77a0a;--M:#2b7a4b;--ok:#2b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#212120;--card:#2b2b29;--text:#ecebe6;--mute:#9b9a92;--line:#3a3a37;--acc:#6b9bff;--C:#ff7a6e;--H:#f0b04d;--M:#5fc08a;--ok:#5fc08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--panel:#212120;--card:#2b2b29;--text:#ecebe6;--mute:#9b9a92;--line:#3a3a37;--acc:#6b9bff;--C:#ff7a6e;--H:#f0b04d;--M:#5fc08a;--ok:#5fc08a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px;max-width:1500px;margin:auto}
h1{margin:0 0 4px;font-size:20px}
.sub{color:var(--mute);font-size:13px}
.bar{height:10px;background:var(--panel);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.stats b{color:var(--text)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;padding:8px 16px 24px;max-width:1500px;margin:auto;overflow-x:auto}
.col{background:var(--panel);border-radius:10px;padding:8px;min-height:200px}
.col.over{outline:2px dashed var(--acc)}
.col h2{font-size:13px;margin:2px 4px 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
.col h2 span{color:var(--mute);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.card.C{border-left-color:var(--C)}.card.H{border-left-color:var(--H)}.card.M{border-left-color:var(--M)}
.top{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:3px}
.sev{font-weight:600}.sev.C{color:var(--C)}.sev.H{color:var(--H)}.sev.M{color:var(--M)}
.t{font-weight:600;font-size:13px}
.d{color:var(--mute);font-size:12px;margin-top:2px}
.mv{display:flex;gap:4px;margin-top:6px}
.mv button{padding:2px 8px;font-size:12px}
.done .t{text-decoration:line-through;color:var(--mute)}
.wk{font-size:11px;color:var(--mute);margin:4px 2px 6px}
.g{margin-top:6px;font-size:12px}.g summary{cursor:pointer;color:var(--acc)}.gb div{margin-top:5px}.gb b{color:var(--mute)}
@media(max-width:700px){.board{grid-template-columns:repeat(5,80vw)}}
</style>
</head>
<body>
<header>
<h1>Retail Analytics Platform — 56-Day Kanban</h1>
<div class="sub">Drag cards between columns, or use the arrow buttons. Progress saves in this browser.</div>
<div class="bar"><i id="fill"></i></div>
<div class="stats" id="stats"></div>
<div class="tools">
<select id="wf"></select>
<select id="sf"><option value="">All severities</option><option value="C">Critical</option><option value="H">High</option><option value="M">Medium</option></select>
<button id="reset">Reset board</button>
</div>
</header>
<main class="board" id="board"></main>

"Create the repo with backend/, frontend/, docs/ and a .gitignore (exclude .env). Add labels (critical/high/medium), one milestone per week, and paste all 56 tasks as cards. Write a README stub with the project goal.||Repo is pushed, the board has 56 cards in Backlog, and Day 2 is in Ready.",

"Write down the lifecycle: uploaded → validating → validated/failed → loaded. Decide allowed types (.csv, .xlsx), a max size (e.g. 10–20 MB), required columns, and the metadata to store. Document it in docs/.||A one-page upload spec exists and the statuses are an enum in code.",
